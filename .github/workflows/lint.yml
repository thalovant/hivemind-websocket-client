permissions:
  contents: read
  pull-requests: write

name: Lint

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  lint:
    uses: OpenVoiceOS/gh-automations/.github/workflows/lint.yml@5ef51f8a9e67a938b1adde466359b5309d48f5f6 # dev
    with:
      ruff: true
      pre_commit: false   # set true if .pre-commit-config.yaml exists
